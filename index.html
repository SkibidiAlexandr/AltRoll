<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Альт-гача</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root { --bg:#17101f; --panel:#221830; --text:#f0e7f5; --muted:#9a8aa8; --border:#3a2b4c; --accent:#e0457b; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,'Segoe UI',Roboto,sans-serif; background:var(--bg); color:var(--text); }
  .wrap { max-width:420px; margin:0 auto; padding:16px; display:flex; flex-direction:column; gap:12px; }
  .top { display:flex; justify-content:space-between; align-items:baseline; }
  .title { font-size:18px; font-weight:700; letter-spacing:.3px; }
  .coins { font-size:14px; color:var(--muted); }
  .card { background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:22px 16px;
          text-align:center; display:flex; flex-direction:column; align-items:center; gap:8px; min-height:300px;
          justify-content:center; }
  .emoji { font-size:54px; width:92px; height:92px; line-height:92px; border-radius:50%;
           border:2px solid var(--border); background:var(--bg); }
  .card.common .emoji { border-color:#8a8a99; }
  .card.rare .emoji { border-color:#4aa3f0; }
  .card.epic .emoji { border-color:#a066f0; }
  .card.legendary .emoji { border-color:#e0a82e; }
  .card.mythic .emoji { border-color:#ff4d6d; box-shadow:0 0 16px rgba(255,77,109,.5); }
  .mname { font-size:19px; font-weight:700; }
  .quote { font-size:13px; color:var(--muted); }
  .rarity { display:inline-block; font-size:12px; padding:3px 10px; border-radius:6px; border:1px solid var(--border); }
  .rarity.common { color:#b5b5c2; background:#2a2336; }
  .rarity.rare { color:#4aa3f0; background:#17283a; border-color:#4aa3f0; }
  .rarity.epic { color:#b48af5; background:#2a1d42; border-color:#a066f0; }
  .rarity.legendary { color:#e8b84a; background:#3a2f14; border-color:#e0a82e; }
  .rarity.mythic { color:#ff6b84; background:#3d1420; border-color:#ff4d6d; }
  .meta { font-size:12px; color:var(--muted); }
  .stats { width:100%; display:flex; flex-direction:column; gap:6px; margin-top:4px; }
  .stat { display:grid; grid-template-columns:96px 1fr 28px; align-items:center; gap:8px; font-size:12px; text-align:left; }
  .bar { height:6px; border-radius:3px; background:var(--bg); overflow:hidden; }
  .bar i { display:block; height:100%; background:var(--accent); border-radius:3px; transition:width .35s ease-out; }
  .power { font-size:13px; font-weight:600; }
  .btn { font-size:15px; padding:13px; border-radius:10px; border:none; background:var(--accent); color:#fff;
         cursor:pointer; font-weight:700; }
  .btn:disabled { opacity:.4; }
  .shop { display:flex; gap:8px; }
  .shop .btn { flex:1; background:var(--panel); border:1px solid var(--border); font-size:13px; padding:10px; font-weight:600; }
  .wlist { display:flex; gap:6px; flex-wrap:wrap; }
  .w { font-size:11px; padding:2px 8px; border-radius:6px; border:1px solid var(--border); color:var(--muted); }
  .ctitle { font-size:14px; font-weight:600; }
  .hint { font-size:11px; color:var(--muted); margin-top:-6px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(76px,1fr)); gap:8px; }
  .cell { background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:8px 4px; text-align:center;
          font-size:11px; color:var(--muted); cursor:pointer; }
  .cell .e { font-size:26px; display:block; }
  .cell.locked { opacity:.3; cursor:default; }
  @keyframes pop { 0%{transform:scale(.88);} 60%{transform:scale(1.04);} 100%{transform:scale(1);} }
  .card.pop { animation:pop .3s ease-out; }
  @media (prefers-reduced-motion: reduce) { .card.pop { animation:none; } .bar i { transition:none; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><span class="title">🖤 Альт-гача</span><span class="coins" id="coins">🪙 50</span></div>

  <div class="card" id="card">
    <span class="emoji" id="emoji">🦇</span>
    <span class="mname" id="mname">Нажми «Крутить»</span>
    <span class="quote" id="quote">У каждой выпавшей альтушки свои случайные характеристики</span>
    <span class="rarity common" id="rarity" style="display:none">редкость</span>
    <span class="meta" id="meta"></span>
    <div class="stats" id="stats" style="display:none"></div>
  </div>

  <button class="btn" id="spin">Крутить · 10 🪙</button>
  <div class="shop">
    <button class="btn" id="buy100">100 🪙 · Stars</button>
    <button class="btn" id="buy500">550 🪙 · Stars</button>
  </div>
  <div class="wlist">
    <span class="w">Обычная 60%</span><span class="w">Редкая 25%</span>
    <span class="w">Эпик 10%</span><span class="w">Лега 4%</span><span class="w">Миф 1%</span>
  </div>
  <span class="ctitle">Коллекция · <span id="ccount">0</span>/15</span>
  <span class="hint">Нажми на открытую карточку, чтобы увидеть её лучший экземпляр</span>
  <div class="grid" id="grid"></div>
</div>
<script>
var tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }

/* Все персонажи вымышленные, совершеннолетние. Меняй имена, эмодзи и цитаты как угодно. */
var GIRLS = [
  {e:'🎧', n:'Эмо Алиса',       q:'Мой плейлист тебя не поймёт',     r:'common', w:600},
  {e:'🦇', n:'Вера Нуар',       q:'Солнце? Нет, спасибо',            r:'common', w:600},
  {e:'🛹', n:'Скейт-Рита',      q:'Упала. Встала. Повторила',        r:'common', w:600},
  {e:'📼', n:'Гранж-Маша',      q:'Куртка старше меня',              r:'common', w:600},
  {e:'🎸', n:'Панк-Лена',       q:'Трёх аккордов хватит',            r:'rare', w:250},
  {e:'🕸️', n:'Пастель-гот Соня', q:'Розовый — это тоже чёрный',      r:'rare', w:250},
  {e:'⛓️', n:'Рок-Диана',       q:'Цепи — это аксессуар',            r:'rare', w:250},
  {e:'🌙', n:'Ведьмочка Ада',   q:'Гороскоп сегодня на моей стороне', r:'rare', w:250},
  {e:'💿', n:'E-girl Кира',     q:'Свет кольцевой лампы — мой друг', r:'epic', w:100},
  {e:'🥀', n:'Лилит',           q:'Приходит ночью, уходит под утро', r:'epic', w:100},
  {e:'🎹', n:'Синти-Мира',      q:'Неон и дождь за окном',           r:'epic', w:100},
  {e:'👑', n:'Королева Мрака',  q:'Трон там, где играет бас',        r:'legendary', w:40},
  {e:'🔮', n:'Оккультная Нина', q:'Карты уже всё сказали',           r:'legendary', w:40},
  {e:'🖤', n:'Нокс',            q:'Альт-богиня полуночи',            r:'mythic', w:10},
  {e:'🌌', n:'???',             q:'Субкультура будущего',            r:'mythic', w:10}
];
var RLABEL = {common:'Обычная', rare:'Редкая', epic:'Эпическая', legendary:'Легендарная', mythic:'Мифическая'};

/* Случайные характеристики: диапазон зависит от редкости */
var STATS = ['Стиль', 'Харизма', 'Мрачность', 'Хаос'];
var STAT_ICON = ['👗', '✨', '🌑', '🌀'];
var RANGE = {common:[10,60], rare:[20,70], epic:[35,85], legendary:[50,95], mythic:[65,100]};
var GENRES = ['пост-панк', 'дарквейв', 'эмо', 'шугейз', 'синтвейв', 'гранж', 'хардкор', 'лоу-фай', 'индастриал'];
var ACCS = ['чокер', 'цепочка на джинсах', 'кастомные ботинки', 'сетчатые перчатки', 'значки на рюкзаке',
            'потёртая косуха', 'обесцвеченная чёлка', 'кольцо в носу', 'полосатые гетры', 'винтажный плеер'];

function rnd(a, b){ return a + Math.floor(Math.random() * (b - a + 1)); }
function oneOf(arr){ return arr[Math.floor(Math.random() * arr.length)]; }
function rollInstance(m){
  var rg = RANGE[m.r], s = [], p = 0;
  for (var i = 0; i < STATS.length; i++){ var v = rnd(rg[0], rg[1]); s.push(v); p += v; }
  return {s:s, g:oneOf(GENRES), a:oneOf(ACCS), p:p};
}

var coins = 50, owned = {}, best = {};
try {
  var sv = localStorage.getItem('altgacha');
  if (sv) { sv = JSON.parse(sv); coins = sv.coins; owned = sv.owned || {}; best = sv.best || {}; }
} catch(e) {}
function save(){ try { localStorage.setItem('altgacha', JSON.stringify({coins:coins, owned:owned, best:best})); } catch(e) {} }

var grid = document.getElementById('grid');
GIRLS.forEach(function(m, i){
  var d = document.createElement('div');
  d.className = 'cell locked'; d.id = 'cell' + i;
  d.innerHTML = '<span class="e">' + m.e + '</span>' + m.n + ' <span id="cnt' + i + '" style="color:#c9b8d6"></span>';
  d.addEventListener('click', function(){ if (owned[i] && best[i] && !spinning) show(i, best[i], true); });
  grid.appendChild(d);
});

function render(){
  document.getElementById('coins').textContent = '🪙 ' + coins;
  var n = 0;
  GIRLS.forEach(function(m, i){
    var c = owned[i] || 0;
    document.getElementById('cell' + i).className = c ? 'cell' : 'cell locked';
    document.getElementById('cnt' + i).textContent = c > 1 ? '×' + c : '';
    if (c) n++;
  });
  document.getElementById('ccount').textContent = n;
  document.getElementById('spin').disabled = spinning || coins < 10;
}

function show(idx, inst, isBest){
  var m = GIRLS[idx];
  document.getElementById('emoji').textContent = m.e;
  document.getElementById('mname').textContent = m.n;
  document.getElementById('quote').textContent = m.q;
  var r = document.getElementById('rarity');
  r.className = 'rarity ' + m.r; r.textContent = RLABEL[m.r]; r.style.display = 'inline-block';
  document.getElementById('meta').textContent = inst.g + ' · ' + inst.a + (isBest ? ' · лучший экземпляр' : '');
  var html = '';
  for (var i = 0; i < STATS.length; i++){
    html += '<div class="stat"><span>' + STAT_ICON[i] + ' ' + STATS[i] + '</span>' +
            '<span class="bar"><i style="width:' + inst.s[i] + '%"></i></span><span>' + inst.s[i] + '</span></div>';
  }
  html += '<div class="power">Сила: ' + inst.p + ' / 400</div>';
  var st = document.getElementById('stats');
  st.innerHTML = html; st.style.display = 'flex';
  var card = document.getElementById('card');
  card.className = 'card ' + m.r;
  card.classList.remove('pop'); void card.offsetWidth; card.classList.add('pop');
}

function pick(){
  var t = GIRLS.reduce(function(s, m){ return s + m.w; }, 0), x = Math.random() * t;
  for (var i = 0; i < GIRLS.length; i++){ x -= GIRLS[i].w; if (x <= 0) return i; }
  return 0;
}

var spinning = false;
document.getElementById('spin').addEventListener('click', function(){
  if (spinning || coins < 10) return;
  coins -= 10; spinning = true;
  var idx = pick(), m = GIRLS[idx], inst = rollInstance(m);
  owned[idx] = (owned[idx] || 0) + 1;
  if (!best[idx] || inst.p > best[idx].p) best[idx] = inst;
  save(); render();
  var k = 0, steps = 12;
  var iv = setInterval(function(){
    var p = GIRLS[Math.floor(Math.random() * GIRLS.length)];
    document.getElementById('emoji').textContent = p.e;
    document.getElementById('mname').textContent = '...';
    document.getElementById('rarity').style.display = 'none';
    document.getElementById('stats').style.display = 'none';
    document.getElementById('meta').textContent = '';
    if (++k >= steps){
      clearInterval(iv);
      spinning = false;
      show(idx, inst, false);
      render();
    }
  }, 70);
});

/* --- Оплата Telegram Stars (подключи к своему бэкенду для выдачи товаров) --- */
function buyStars(amount, coinsToAdd){
  if (!tg || !tg.openInvoice) { alert('Открой через Telegram (BotFather → Menu Button / WebApp)'); return; }
  // Реальную ссылку на инвойс даёт твой бэкенд через Bot API: createInvoiceLink
  // fetch('https://ТВОЙ_СЕРВЕР/invoice', ...).then(url => tg.openInvoice(url, handler))
  alert('Здесь подключается инвойс Telegram Stars: твой сервер вызывает createInvoiceLink, возвращает ссылку, а tg.openInvoice(url) открывает оплату. После оплаты накинуть ' + coinsToAdd + ' 🪙.');
}
document.getElementById('buy100').addEventListener('click', function(){ buyStars(50, 100); });
document.getElementById('buy500').addEventListener('click', function(){ buyStars(250, 550); });

render();
</script>
</body>
</html>
